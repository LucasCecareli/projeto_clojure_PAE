<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Luthier José Valderrama | Violões</title>

  <link rel="icon" type="image/png" href="./.img/logo.png">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <section class="topo">

  <div class="cabecalho-topo">

    <div class="texto-topo">

      <span class="subtitulo">
        LUTHIERIA JOSÉ VALDERRAMA • INSTRUMENTOS DE CORDA
      </span>

      <h1>Calculadora de Trastes</h1>

      <p>
        Informe o tamanho da escala do instrumento em milímetros
        para calcular a posição correta dos trastes.
      </p>

    </div>

    <div class="logo-container">
      <img src="/.img/logo.png" alt="Logo Valderrama">
    </div>

  </div>

</section>

    <section class="formulario">
      <input
        type="number"
        id="escala"
        placeholder="Ex: 650"
        min="1"
      >

      <button id="botao-calcular" onclick="calcularTrastes()">
        CALCULAR
      </button>
    </section>

    <div id="mensagem" class="mensagem"></div>

    <section id="resumo" class="resumo"></section>

    <section class="tabela-container">
      <table>
        <thead>
          <tr>
            <th>Traste</th>
            <th>Espaçamento (mm)</th>
            <th>Distância até o Rastilho (mm)</th>
            <th>Distância até a Pestana (mm)</th>
          </tr>
        </thead>

        <tbody id="tabela-trastes"></tbody>
      </table>
    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
